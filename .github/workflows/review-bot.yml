name: Review Bot

# Trigger: pull_request (not pull_request_target). This means the bot never
# runs with elevated/write-scoped secrets while checking out a fork's
# untrusted code — see docs/assignment/github-actions.md's Security
# considerations for why this tradeoff is deliberate, and what it costs
# (fork PRs get a failed check but no posted comment; same-repo PRs get
# the full review).
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Minimum permissions for this job: read the code, write PR comments and
# labels. Nothing broader — no contents:write (auto-fix runs report-only,
# not commit-and-push, specifically so this doesn't need to change; see
# docs/assignment/autofix-and-triage.md), no issues:write beyond what PR
# comments/labels need, no repository-admin scope of any kind.
permissions:
  contents: read
  pull-requests: write

# A new push to the same PR supersedes any review already in flight for
# it — no point finishing a review of a commit that's no longer current.
concurrency:
  group: review-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Run review bot and post findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head (full history, for merge-base diffing)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build review bot
        run: pnpm --filter @lead-radar/review-bot run build

      # continue-on-error: the whole job intentionally does NOT stop here
      # on failure — the "Post review to PR" step below still runs (via
      # if: always()) and posts a safe, generic failure notice instead of
      # silently leaving the PR with no feedback. The job is still marked
      # failed at the end (see the final step) so the failure is visible
      # as a red check, just not as a crashed workflow with no PR comment.
      - name: Run review bot
        id: run_bot
        timeout-minutes: 5
        env:
          # Reserved for a future LLM-backed Plan/reviewer stage (see
          # docs/assignment/context-strategy.md §4 and §10) — the four
          # reviewers implemented today are fully deterministic and never
          # read this. Never hardcoded; unset/empty does not fail this
          # step. NEVER echo this value anywhere.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node packages/review-bot/scripts/review.cjs \
            "$GITHUB_WORKSPACE" \
            "origin/${{ github.event.pull_request.base.ref }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > review-findings.json
        continue-on-error: true

      - name: Record whether the review bot actually succeeded
        id: bot_status
        if: always()
        run: |
          if [ "${{ steps.run_bot.outcome }}" = "success" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      # Report-only (no --apply): detects Prettier-fixable formatting on
      # this PR's changed files and reports it in the review comment, but
      # does not commit anything — see docs/assignment/autofix-and-triage.md
      # for why this deployment keeps contents: read rather than granting
      # write access for an auto-commit. Best-effort: failure here never
      # blocks the review itself.
      - name: Check for safe auto-fixes (report only)
        id: run_autofix
        if: always()
        continue-on-error: true
        run: |
          node packages/review-bot/scripts/autofix.cjs \
            "$GITHUB_WORKSPACE" \
            "origin/${{ github.event.pull_request.base.ref }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > autofix-result.json

      # continue-on-error here does NOT hide this failure — the final step
      # below still fails the job if this step failed. It exists only so
      # the fallback-notice step after it can run and post *something* to
      # the PR when this step itself can't (e.g. the review-bot package
      # failed to build/load) — see docs/review-bot/github-actions.md's
      # "Failure modes" section for the incident this was written for.
      - name: Post review + triage label to PR (creates or updates one comment — never duplicates)
        id: post_review
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node packages/review-bot/scripts/post-review.cjs \
            "$( [ '${{ steps.bot_status.outputs.success }}' = 'true' ] && echo review-findings.json || echo __FAILED__ )" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            autofix-result.json

      # Last-resort, dependency-free fallback: only runs if "Post review +
      # triage" itself crashed before it could post anything (distinct from
      # "the review generation failed", which that step already handles
      # gracefully via the __FAILED__ sentinel above). Uses plain curl and
      # node -e — no require("../dist") — so it still works even when the
      # thing that's broken is the review-bot package itself. Best-effort
      # (its own failure is swallowed): the job fails either way via the
      # step below, this only adds a human-visible explanation on the PR
      # instead of a bare Actions log.
      - name: Post fallback notice if the posting step itself crashed
        if: always() && steps.post_review.outcome == 'failure'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(node -e '
            const runUrl = process.argv[1];
            console.log(JSON.stringify({
              body: "<!-- review-bot:findings -->\n\n### 🤖 Review bot\n\nThe review-posting step itself failed to run — this is different from \"no issues found\". No review could be posted for this commit. See [this workflow run](" + runUrl + ") for the exact error.",
            }));
          ' "$RUN_URL")
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$BODY" > /dev/null

      - name: Fail the job if the review bot or the posting step failed
        if: steps.bot_status.outputs.success != 'true' || steps.post_review.outcome == 'failure'
        run: |
          echo "The review bot pipeline did not complete successfully — see the 'Run review bot' and/or 'Post review + triage' steps above."
          exit 1
